<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MiniTalk · เว็บบอร์ดสำหรับคนช่างคุย</title>
  <script>
    // ตั้งธีมก่อนวาดหน้า เพื่อไม่ให้จอกะพริบ
    try { document.documentElement.dataset.theme = localStorage.getItem('forum_theme') || 'light'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- ========== หน้าเข้าสู่ระบบ (Landing) ========== -->
  <main id="landing" class="landing hidden">
    <section class="hero">
      <div class="wordmark">MiniTalk</div>
      <p class="hero-line">คุยเรื่องที่ชอบ กับใครก็ได้</p>
      <p class="hero-sub">ตั้งกระทู้ ไลก์ คอมเมนต์ และส่องโพสต์ไปเรื่อย</p>
    </section>

    <section class="auth-panel">
      <button class="icon-btn theme-corner" data-action="theme" aria-label="สลับโหมดสว่าง/มืด"></button>
      <div class="auth-card">
        <div class="seg" role="tablist">
          <button class="seg-btn active" data-tab="login" role="tab">เข้าสู่ระบบ</button>
          <button class="seg-btn" data-tab="register" role="tab">สมัครสมาชิก</button>
          <button class="seg-btn" data-tab="forgot" role="tab">ลืมรหัสผ่าน</button>
        </div>

        <form id="login-form" class="auth-form">
          <h1>ยินดีต้อนรับกลับมา</h1>
          <label>Username<input type="text" name="username" autocomplete="username" required></label>
          <label>รหัสผ่าน<input type="password" name="password" autocomplete="current-password" required></label>
          <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <h1>สร้างบัญชีใหม่</h1>
          <label>Username<input type="text" name="username" autocomplete="username" required></label>
          <label>ชื่อ-นามสกุล<input type="text" name="name" autocomplete="name" required></label>
          <label>อีเมล<input type="email" name="email" autocomplete="email" required></label>
          <label>รหัสผ่าน (อย่างน้อย 8 ตัว)<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
          <button type="submit" class="btn btn-primary">สมัครสมาชิก</button>
        </form>

        <form id="forgot-form" class="auth-form hidden">
          <h1>ตั้งรหัสผ่านใหม่</h1>
          <label>Username<input type="text" name="username" required></label>
          <label>อีเมลที่สมัครไว้<input type="email" name="email" required></label>
          <label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)<input type="password" name="newPassword" minlength="8" autocomplete="new-password" required></label>
          <button type="submit" class="btn btn-primary">ตั้งรหัสผ่านใหม่</button>
        </form>
      </div>
    </section>
  </main>

  <!-- ========== แอปหลัก ========== -->
  <div id="app" class="app hidden">
    <nav class="nav" aria-label="เมนูหลัก">
      <a class="logo" href="#/">MiniTalk</a>
      <a class="nav-item" href="#/" data-nav="home"><span data-icon="home"></span><b>หน้าแรก</b></a>
      <button class="nav-item" data-action="focus-search"><span data-icon="search"></span><b>ค้นหา</b></button>
      <a class="nav-item" id="nav-profile" href="#/" data-nav="profile"><span data-icon="user"></span><b>โปรไฟล์</b></a>
      <button class="nav-item" data-action="theme"><span data-icon="theme"></span><b>เปลี่ยนโหมด</b></button>
      <button class="btn btn-primary nav-post" data-action="focus-compose">โพสต์</button>
      <div class="nav-me">
        <span id="nav-avatar"></span>
        <div class="nav-me-text"><strong id="nav-name"></strong><small id="nav-handle"></small></div>
        <button class="icon-btn" data-action="logout" aria-label="ออกจากระบบ" title="ออกจากระบบ"><span data-icon="logout"></span></button>
      </div>
    </nav>

    <main class="main">
      <!-- หน้าฟีด -->
      <section id="view-feed">
        <form id="post-form" class="composer">
          <span id="composer-avatar"></span>
          <div class="composer-fields">
            <input type="text" name="title" placeholder="หัวข้อบทความ" required>
            <textarea name="content" rows="3" placeholder="มีอะไรอยากเล่าไหม?" required></textarea>
            <div class="composer-row">
              <select name="category" aria-label="หมวดหมู่" required>
                <option value="ทั่วไป">ทั่วไป</option>
                <option value="เทคโนโลยี">เทคโนโลยี</option>
                <option value="การศึกษา">การศึกษา</option>
                <option value="บันเทิง">บันเทิง</option>
              </select>
              <input type="text" name="tags" placeholder="แท็ก คั่นด้วยจุลภาค เช่น js, node" aria-label="แท็ก">
              <button type="submit" class="btn btn-primary">โพสต์</button>
            </div>
          </div>
        </form>
        <div id="filter-bar" class="filter-bar hidden"></div>
        <div id="posts-container" class="feed"></div>
      </section>

      <!-- หน้าโปรไฟล์ -->
      <section id="view-profile" class="hidden"></section>
    </main>

    <aside class="rail">
      <label class="search">
        <span data-icon="search"></span>
        <input id="search-input" type="search" placeholder="ค้นหาโพสต์ แท็ก หรือผู้ใช้" aria-label="ค้นหา">
      </label>
      <div class="rail-block">
        <h2>หมวดหมู่</h2>
        <div id="category-chips" class="chips"></div>
      </div>
      <div class="rail-block">
        <h2>แท็กยอดนิยม</h2>
        <div id="tag-chips" class="chips"></div>
      </div>
    </aside>

    <nav class="tabbar" aria-label="เมนูมือถือ">
      <a href="#/" data-nav="home" aria-label="หน้าแรก"><span data-icon="home"></span></a>
      <button data-action="focus-search" aria-label="ค้นหา"><span data-icon="search"></span></button>
      <button data-action="focus-compose" class="tab-post" aria-label="เขียนโพสต์"><span data-icon="plus"></span></button>
      <a href="#/" id="tab-profile" data-nav="profile" aria-label="โปรไฟล์"><span data-icon="user"></span></a>
      <button data-action="theme" aria-label="สลับโหมด"><span data-icon="theme"></span></button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
